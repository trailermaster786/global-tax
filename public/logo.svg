<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="105" r="75" fill="#2C3E50" opacity="0.15"/>
  
  <!-- Globe/network lines -->
  <circle cx="100" cy="105" r="65" stroke="#5C7A8A" stroke-width="0.8" fill="none" opacity="0.4"/>
  <ellipse cx="100" cy="105" rx="40" ry="65" stroke="#5C7A8A" stroke-width="0.8" fill="none" opacity="0.4"/>
  <ellipse cx="100" cy="105" rx="65" ry="40" stroke="#5C7A8A" stroke-width="0.8" fill="none" opacity="0.4"/>
  <line x1="35" y1="80" x2="165" y2="80" stroke="#5C7A8A" stroke-width="0.6" opacity="0.3"/>
  <line x1="35" y1="130" x2="165" y2="130" stroke="#5C7A8A" stroke-width="0.6" opacity="0.3"/>
  
  <!-- Toll gate pillars -->
  <rect x="55" y="55" width="8" height="80" rx="2" fill="#2C3E50"/>
  <rect x="137" y="55" width="8" height="80" rx="2" fill="#2C3E50"/>
  
  <!-- Toll gate arch -->
  <path d="M 59 55 C 59 25, 141 25, 141 55" stroke="#2E8B8B" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 65 52 C 65 32, 135 32, 135 52" stroke="#4FA9A9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- RFID icon on arch -->
  <rect x="88" y="28" width="24" height="16" rx="3" fill="#2C3E50"/>
  <text x="100" y="39" text-anchor="middle" fill="white" font-size="7" font-weight="bold" font-family="Arial">RFID</text>
  
  <!-- Signal waves left -->
  <path d="M 62 35 C 58 35, 58 28, 62 28" stroke="#2E8B8B" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 58 37 C 52 37, 52 26, 58 26" stroke="#2E8B8B" stroke-width="1.5" fill="none" opacity="0.5"/>
  
  <!-- Camera icon right -->
  <rect x="132" y="30" width="12" height="8" rx="1" fill="#2C3E50"/>
  <circle cx="138" cy="34" r="2.5" stroke="white" stroke-width="1" fill="none"/>
  
  <!-- Road curving through -->
  <path d="M 50 140 C 70 120, 90 100, 100 85 C 110 70, 130 55, 155 45" stroke="#2C3E50" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 50 140 C 70 120, 90 100, 100 85 C 110 70, 130 55, 155 45" stroke="#5C7A8A" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.4"/>
  
  <!-- Road center line -->
  <path d="M 55 135 L 65 125 M 75 115 L 85 105 M 95 95 L 105 85 M 115 75 L 125 65 M 135 55 L 145 48" stroke="#2E8B8B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Truck on road -->
  <rect x="65" y="108" width="22" height="14" rx="2" fill="#2C3E50"/>
  <rect x="87" y="112" width="12" height="10" rx="1" fill="#5C7A8A"/>
  <circle cx="72" cy="124" r="3" fill="#2C3E50"/>
  <circle cx="82" cy="124" r="3" fill="#2C3E50"/>
  <circle cx="92" cy="124" r="3" fill="#2C3E50"/>
  
  <!-- Cars on road -->
  <rect x="95" y="92" width="16" height="8" rx="2" fill="#2E8B8B"/>
  <rect x="98" y="88" width="10" height="6" rx="1" fill="#4FA9A9"/>
  <circle cx="99" cy="101" r="2" fill="#2C3E50"/>
  <circle cx="107" cy="101" r="2" fill="#2C3E50"/>
  
  <rect x="115" y="78" width="14" height="7" rx="2" fill="#2E8B8B"/>
  <circle cx="119" cy="86" r="1.8" fill="#2C3E50"/>
  <circle cx="126" cy="86" r="1.8" fill="#2C3E50"/>
  
  <!-- Rising arrow -->
  <path d="M 120 110 C 135 90, 150 70, 165 45" stroke="#2E8B8B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 158 42 L 168 42 L 168 52" stroke="#2E8B8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- GLOBAL TOLL text -->
  <text x="100" y="22" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="900" font-family="Arial, sans-serif" letter-spacing="3">GLOBAL TOLL</text>
  
  <!-- Tagline -->
  <text x="100" y="185" text-anchor="middle" fill="#5C7A8A" font-size="7" font-weight="600" font-family="Arial, sans-serif" letter-spacing="2">DRIVING FINANCIAL FLOW</text>
</svg>
